<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation Test</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow">
                <div class="card-header">
                    <h3 class="mb-0">Registration Form</h3>
                </div>

                <div class="card-body">

                    <form id="testForm">

                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input
                                type="text"
                                class="form-control"
                                id="name"
                                name="Full Name">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                name="Email">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Phone</label>
                            <input
                                type="text"
                                class="form-control"
                                id="phone"
                                name="Phone Number">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input
                                type="password"
                                class="form-control"
                                id="password"
                                name="Password">
                        </div>

                        <button class="btn btn-primary w-100">
                            Submit
                        </button>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

<script src="./4- isValidInput.js">
</script>

</body>
</html>
